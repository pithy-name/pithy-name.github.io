name: CI

# Gate for the static site, on every PR into main. Two jobs run at the same time:
#   - "Playwright (Chromium)": every Playwright test, layout and functionality, in
#     Chromium (@links, @responsive, @slant, @console, @analytics, @content, @robots).
#   - "Playwright (WebKit)": the layout tests only (@responsive, @slant), in WebKit on
#     an iPhone 17e profile; WebKit is the engine Safari and iPhone browsers use.
# Branch protection requires checks by these exact names: renaming a job means
# updating the required checks in branch protection at the same time.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full suite (Chromium)
        run: npx playwright test --project=chromium

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  webkit:
    name: Playwright (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run layout tests (WebKit, iPhone 17e)
        run: npx playwright test --project=webkit-iphone

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7
