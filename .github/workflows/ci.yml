name: CI

# Functional gate for the site. Builds it with Jekyll, then runs the Playwright suite
# (@links / @responsive / @console / ...) against the built _site/ on every PR into main.
# Branch protection requires this check by name ("Playwright (functional)"), so a broken
# link, layout overflow, or console error cannot merge to the published branch.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (functional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same build GitHub Pages runs: Ruby 3.3 + the pinned github-pages gem (see Gemfile).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run functional suite
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
