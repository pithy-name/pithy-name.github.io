<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {%- if page.noindex %}
  <meta name="robots" content="noindex" />
  {%- endif %}
  {%- if page.description %}
  <meta name="description" content="{{ page.description | escape }}" />
  <meta property="og:title" content="{{ page.og_title | default: page.title | escape }}" />
  <meta property="og:description" content="{{ page.og_description | default: page.description | escape }}" />
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta name="twitter:card" content="summary" />
  {%- endif %}
  <title>{{ page.title | escape }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111C2E'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%23B59A5B' stroke-width='5'/%3E%3Cline x1='50' y1='12' x2='50' y2='88' stroke='%23B59A5B' stroke-width='5'/%3E%3Cline x1='12' y1='50' x2='88' y2='50' stroke='%23B59A5B' stroke-width='5'/%3E%3C/svg%3E" />
</head>
<body{% if page.body_page %} data-page="{{ page.body_page }}"{% endif %}>
{%- unless page.skip_link == false %}

  <a href="#main" class="skip-link">Skip to content</a>
{%- endunless %}

{{ content }}

  {% include footer.html %}

  <script src="/assets/components.js" defer></script>

</body>
</html>
